version: "2"

run:
  concurrency: 8
  timeout: 2m
  issues-exit-code: 1
  tests: false

linters:
  default: standard
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - decorder
    - depguard
    - dupl
    - dupword
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - gochecknoinits
    - gocritic
    - godot
    - goprintffuncname
    - gosec
    - nilerr
    - nilnil
    - nlreturn
    - prealloc
    - predeclared
    - reassign
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    govet:
      enable-all: true
    staticcheck:
      checks: [ "all" ]
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/GLAD-DEV/dn
            - github.com/spf13/cobra
            - github.com/BurntSushi/toml
  exclusions:
    rules:
      # Don't require doc comments on exported identifiers since the program is so small, it just adds clutter.
      - linters: [ revive ]
        text: "exported (.+) should have comment"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: true
